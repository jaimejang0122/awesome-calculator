name: Cache Benchmark

on:
  workflow_dispatch:
    inputs:
      cache:
        description: Enable the exact-match node_modules cache
        type: choice
        required: true
        default: 'true'
        options:
          - 'true'
          - 'false'

jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node project
        uses: ./.github/actions/setup
        with:
          node-version: '20'
          cache: ${{ inputs.cache }}
      - run: npm run lint
      - run: npm test