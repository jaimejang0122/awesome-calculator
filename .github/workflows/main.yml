name: Main Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ steps.filter.outputs.app }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app:
              - 'index.js'
              - 'scripts/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/**'
            docs:
              - '**/*.md'
              - 'docs/**'

  test:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  deploy-preview:
    needs: [changes, test]
    if: github.event_name == 'pull_request' && needs.changes.outputs.app == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: preview-pr-${{ github.event.pull_request.number }}
    secrets:
      API_KEY: ${{ secrets.API_KEY }}

  deploy-staging:
    needs: [changes, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && needs.changes.outputs.app == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
    secrets:
      API_KEY: ${{ secrets.API_KEY }}

  deploy-production:
    needs: [changes, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.app == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
    secrets:
      API_KEY: ${{ secrets.API_KEY }}