name: Reusable Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: Deployment environment name
        type: string
        required: true
    secrets:
      API_KEY:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - run: ls dist
      - name: Use secret
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          if [ -z "$API_KEY" ]; then echo "API_KEY missing"; exit 1; fi
          echo "API Key: $API_KEY"
          echo "Deploying to ${{ inputs.environment }} (simulated)"